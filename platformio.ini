; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Default target: the actual attached board is a Seeed XIAO ESP32-C6.
; Without this, bare `pio run`/upload iterates every [env:...] and tries the
; C3 env first, which aborts with "This chip is ESP32-C6, not ESP32-C3".
[platformio]
default_envs = seeed_xiao_esp32c6

; Original C3 Environment (Upgraded to NimBLE v2)
[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@^2.0.0

; seeed_xiao_esp32c6 Environment (Upgraded to NimBLE v2)
[env:seeed_xiao_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@^2.0.0